plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.samadhan.callui'
version = '1.0.0'

android {
  namespace "com.samadhan.callui"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'androidx.core:core-ktx:1.15.0'
}
